[project]
name = "webcontainerui"
version = "0.1.0"
description = "Portal multiusuário para desktops Linux no navegador"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiodocker>=0.23",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "websockets>=13.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "cryptography>=43.0",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not e2e' --strict-markers"
markers = [
    "e2e: exige Docker real e uma imagem webtop; desselecionado por padrão",
]
