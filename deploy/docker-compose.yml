# Composição de produção (D4 em design.md). Caddy termina TLS e atua como
# plano de dados das sessões (change external-stream-proxy); o portal fica só
# na rede interna, sem porta publicada — os webtops que o portal cria também
# ficam nessa mesma rede, nunca publicados no host.
#
# Uso:
#   cd deploy
#   WCUI_ADMIN_EMAIL=admin@seu-dominio.test WCUI_ADMIN_PASSWORD=... \
#   WCUI_DOMAIN=seu-dominio.test \
#   docker compose up -d

services:
  caddy:
    image: caddy:2-alpine
    # Nome fixo: o portal executa `caddy reload` neste container após
    # publicar/retirar rotas de sessão (WCUI_CADDY_CONTAINER).
    container_name: wcui-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Rotas de sessão publicadas pelo portal (volume compartilhado).
      - caddy_routes:/etc/caddy/caddy-routes
      - caddy_data:/data
      - caddy_config:/config
    environment:
      WCUI_DOMAIN: ${WCUI_DOMAIN:?defina WCUI_DOMAIN, o domínio público do portal}
      # Segredo compartilhado com o portal: o forward_auth o apresenta ao
      # endpoint interno de autorização. Sem ele, nada é aprovado.
      WCUI_DATA_PLANE_SECRET: ${WCUI_DATA_PLANE_SECRET:?defina WCUI_DATA_PLANE_SECRET (gere com secrets.token_urlsafe(32))}
    networks:
      - wcui_net
    depends_on:
      - portal

  portal:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WCUI_DB_PATH: /data/webcontainerui.db
      WCUI_DOCKER_NETWORK: wcui_net
      WCUI_ADMIN_EMAIL: ${WCUI_ADMIN_EMAIL:?defina WCUI_ADMIN_EMAIL para provisionar o primeiro administrador}
      WCUI_ADMIN_PASSWORD: ${WCUI_ADMIN_PASSWORD:?defina WCUI_ADMIN_PASSWORD (mínimo 12 caracteres)}
      # Cifra as chaves SSH dos usuários em repouso (ssh-identity). Gere com:
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      WCUI_SSH_KEY_ENCRYPTION_KEY: ${WCUI_SSH_KEY_ENCRYPTION_KEY:?defina WCUI_SSH_KEY_ENCRYPTION_KEY (gere com Fernet.generate_key())}
      # Honra os cabeçalhos encaminhados pelo Caddy (X-Forwarded-Proto/For)
      # vindos da rede interna: sem isto o portal sempre se vê como http e o
      # cookie de sessão nasce sem a flag Secure, e o limitador de login só
      # enxerga o IP do Caddy. A allowlist precisa casar com a subnet fixada
      # no IPAM de `wcui_net` abaixo (change harden-login, M1/M2).
      UVICORN_PROXY_HEADERS: "true"
      UVICORN_FORWARDED_ALLOW_IPS: ${WCUI_FORWARDED_ALLOW_IPS:-10.213.0.0/24}
      # Plano de dados externo (change external-stream-proxy): o portal
      # publica as rotas no volume compartilhado e recarrega o Caddy por
      # `docker exec`. O mesmo segredo do serviço caddy acima.
      WCUI_DATA_PLANE_SECRET: ${WCUI_DATA_PLANE_SECRET:?defina WCUI_DATA_PLANE_SECRET (gere com secrets.token_urlsafe(32))}
      WCUI_CADDY_ROUTES_DIR: /data/caddy-routes
      WCUI_CADDY_CONTAINER: wcui-caddy
    volumes:
      - wcui_db:/data
      # Mesmo volume de rotas montado no Caddy (caminho de leitura diferente).
      - caddy_routes:/data/caddy-routes
      # O portal precisa do socket do Docker para criar os containers de
      # desktop. Ver deploy/SECURITY.md: isto equivale a dar root no host
      # a este serviço — não é um descuido, é a superfície mínima possível.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - wcui_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Os containers webtop criados pelo portal entram nesta mesma rede, sem
  # publicar porta nenhuma no host (D1/D2 em design.md) — o isolamento
  # entre usuários depende disso, não só da checagem de propriedade no proxy.
  # A subnet é fixada para que UVICORN_FORWARDED_ALLOW_IPS (acima) possa
  # allowlistar a rede interna de forma estável entre deploys.
  wcui_net:
    name: wcui_net
    ipam:
      config:
        - subnet: 10.213.0.0/24

volumes:
  wcui_db:
  caddy_routes:
  caddy_data:
  caddy_config:
