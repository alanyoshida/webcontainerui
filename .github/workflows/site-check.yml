# Valida o site de produto em pull requests: testes do script de traduções,
# checagem de tradução defasada e build (que valida os links internos).
# Não publica nada.
name: site-check

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-*.yml"

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      # `npm run build` roda antes a checagem de traduções (prebuild).
      - run: npm run build
